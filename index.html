<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Music - Piano, Drums & Guitar</title>
    <link rel="stylesheet" href="style.css?v=13">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
</head>

<body>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="overlay-canvas"></canvas>
        <div id="loading" class="loading-text">Loading Model & Audio (might take a moment)...</div>

        <div class="mode-toggle" id="mode-toggle" style="display: none;">
            <button id="btn-piano" class="active">Piano</button>
            <button id="btn-drums">Drums</button>
            <button id="btn-guitar">Guitar</button>
        </div>

        <div class="piano-scroll-wrapper" id="piano-scroll-wrapper" style="display: none;">
            <div class="piano" id="piano">
                <!-- Keys generated by JS -->
            </div>
        </div>

        <div class="drum-kit" id="drum-kit" style="display: none;">
            <div class="drum-pad kick" data-drum="kick"><span>KICK</span></div>
            <div class="drum-pad snare" data-drum="snare"><span>SNARE</span></div>
            <div class="drum-pad hihat" data-drum="hihat"><span>HI-HAT</span></div>
            <div class="drum-pad tom1" data-drum="tom1"><span>TOM 1</span></div>
            <div class="drum-pad floor-tom" data-drum="floorTom"><span>FLOOR TOM</span></div>
            <div class="drum-pad crash" data-drum="crash"><span>CRASH</span></div>
        </div>

        <div class="guitar-kit" id="guitar-kit" style="display: none;">
            <div class="acoustic-guitar">
                <div class="guitar-neck" id="real-fretboard">
                    <!-- 12 Frets generated by JS -->
                </div>
                <div class="guitar-body">
                    <div class="guitar-soundhole"></div>
                    <div class="guitar-pickguard"></div>
                    <div class="guitar-bridge"></div>
                </div>
                <div class="strings-container" id="strings-container">
                    <div class="guitar-string" data-string="5"></div> <!-- High E -->
                    <div class="guitar-string" data-string="4"></div> <!-- B -->
                    <div class="guitar-string" data-string="3"></div> <!-- G -->
                    <div class="guitar-string" data-string="2"></div> <!-- D -->
                    <div class="guitar-string" data-string="1"></div> <!-- A -->
                    <div class="guitar-string" data-string="0"></div> <!-- Low E -->
                </div>
            </div>
        </div>
    </div>

    <button id="start-camera">Start Air Music</button>

    <script>
        const video = document.getElementById('webcam');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const startBtn = document.getElementById('start-camera');
        const loadingText = document.getElementById('loading');

        const piano = document.getElementById('piano');
        const pianoScrollWrapper = document.getElementById('piano-scroll-wrapper');
        const drumKit = document.getElementById('drum-kit');
        const guitarKit = document.getElementById('guitar-kit');
        const modeToggle = document.getElementById('mode-toggle');

        let detector;
        let currentMode = 'piano'; // 'piano', 'drums', 'guitar'

        // --- UI Setup ---
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            pianoScrollWrapper.style.display = mode === 'piano' ? 'block' : 'none';
            drumKit.style.display = mode === 'drums' ? 'block' : 'none';
            guitarKit.style.display = mode === 'guitar' ? 'block' : 'none';
        }

        document.getElementById('btn-piano').addEventListener('click', () => switchMode('piano'));
        document.getElementById('btn-drums').addEventListener('click', () => switchMode('drums'));
        document.getElementById('btn-guitar').addEventListener('click', () => switchMode('guitar'));

        // --- Piano Generation ---
        const notesData = [];
        notesData.push({ white: 'A0', black: 'Bb0' });
        notesData.push({ white: 'B0', black: null });
        for (let o = 1; o <= 7; o++) {
            notesData.push({ white: `C${o}`, black: `Db${o}` });
            notesData.push({ white: `D${o}`, black: `Eb${o}` });
            notesData.push({ white: `E${o}`, black: null });
            notesData.push({ white: `F${o}`, black: `Gb${o}` });
            notesData.push({ white: `G${o}`, black: `Ab${o}` });
            notesData.push({ white: `A${o}`, black: `Bb${o}` });
            notesData.push({ white: `B${o}`, black: null });
        }
        notesData.push({ white: 'C8', black: null });

        const whiteKeyWidth = 100;
        const allNotes = [];

        notesData.forEach((data, index) => {
            allNotes.push(data.white);
            const whiteKey = document.createElement('div');
            whiteKey.className = 'key white';
            whiteKey.dataset.note = data.white;
            piano.appendChild(whiteKey);

            if (data.black) {
                allNotes.push(data.black);
                const blackKey = document.createElement('div');
                blackKey.className = 'key black';
                blackKey.dataset.note = data.black;
                blackKey.style.left = `${(index + 1) * whiteKeyWidth}px`;
                piano.appendChild(blackKey);
            }
        });

        // --- Gesture Detection Math ---
        function mapCoord(kp) {
            const layout = getVideoLayout();
            const rX = (kp.x / video.videoWidth) * layout.renderWidth + layout.offsetX;
            return {
                x: window.innerWidth - rX,
                y: (kp.y / video.videoHeight) * layout.renderHeight + layout.offsetY,
                z: kp.z
            };
        }

        // --- Rotated Guitar Physics ---
        let guitarMathInitialized = false;
        let stringLocalLines = [];
        let guitarOrigin = {x: 0, y: 0};
        const guitarAngle = 15 * Math.PI / 180;
        const guitarScale = 1;

        function initGuitarMath() {
            const guitar = document.querySelector('.acoustic-guitar');
            // Temporarily un-rotate and un-scale
            guitar.style.transform = 'none'; 
            void guitar.offsetHeight; // Force layout flush
            
            const gRect = guitar.getBoundingClientRect();
            
            // transform-origin is 75% 50%
            guitarOrigin = {
                x: gRect.left + gRect.width * 0.75,
                y: gRect.top + gRect.height * 0.5
            };
            
            stringLocalLines = [];
            document.querySelectorAll('.guitar-string').forEach(str => {
                const rect = str.getBoundingClientRect();
                stringLocalLines.push({
                    index: parseInt(str.dataset.string),
                    y: rect.top + rect.height / 2
                });
            });
            
            // Restore transform
            guitar.style.transform = ''; 
            guitarMathInitialized = true;
        }

        function toUnrotated(x, y) {
            const dx = x - guitarOrigin.x;
            const dy = y - guitarOrigin.y;
            // un-scale
            const sx = dx / guitarScale;
            const sy = dy / guitarScale;
            // un-rotate (rotate by +15deg)
            const cos = Math.cos(-guitarAngle);
            const sin = Math.sin(-guitarAngle);
            return {
                x: guitarOrigin.x + sx * cos - sy * sin,
                y: guitarOrigin.y + sx * sin + sy * cos
            };
        }

        // --- Guitar Generation ---
        const fretboard = document.getElementById('real-fretboard');
        for (let i = 1; i <= 12; i++) {
            const fret = document.createElement('div');
            fret.className = 'fret-column';
            fret.dataset.fret = i;

            // Fret markers
            if ([3, 5, 7, 9].includes(i)) {
                const marker = document.createElement('div');
                marker.className = 'fret-marker';
                fret.appendChild(marker);
            } else if (i === 12) {
                const m1 = document.createElement('div'); m1.className = 'fret-marker'; m1.style.left = '20%'; fret.appendChild(m1);
                const m2 = document.createElement('div'); m2.className = 'fret-marker'; m2.style.right = '20%'; fret.appendChild(m2);
            }

            const label = document.createElement('div');
            label.className = 'fret-label';
            label.innerText = i;
            fret.appendChild(label);

            fretboard.appendChild(fret);
        }

        // --- Audio Setup ---
        const audioBuffers = {};
        let audioContext;

        async function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const batchSize = 10;
            for (let i = 0; i < allNotes.length; i += batchSize) {
                const batch = allNotes.slice(i, i + batchSize);
                await Promise.all(batch.map(async (note) => {
                    try {
                        const response = await fetch(`sound/${note}.mp3`);
                        if (response.ok) {
                            const arrayBuffer = await response.arrayBuffer();
                            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                            audioBuffers[note] = audioBuffer;
                        }
                    } catch (e) {
                        console.error(`Failed to load audio for ${note}`, e);
                    }
                }));
            }
        }

        // --- Guitar State ---
        const guitarBaseFrequencies = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63]; // E2, A2, D3, G3, B3, E4
        let frettedStrings = [0, 0, 0, 0, 0, 0];

        function playGuitarString(stringIndex, velocity = 80) {
            if (!audioContext) return;
            const time = audioContext.currentTime;
            // Boosted Volume
            const volume = Math.min(Math.max(velocity / 20, 0.5), 2.5);

            const fretNumber = frettedStrings[stringIndex];
            
            // Real Physics Formula: F = Base * 2^(fret/12)
            const frequency = guitarBaseFrequencies[stringIndex] * Math.pow(2, fretNumber / 12);

            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(frequency, time);

            filter.type = 'lowpass';
            // Pluck transient
            filter.frequency.setValueAtTime(frequency * 5, time);
            filter.frequency.exponentialRampToValueAtTime(frequency, time + 0.4);

            gainNode.gain.setValueAtTime(volume, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + 2.5); // Guitar sustain

            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);

            osc.start(time);
            osc.stop(time + 3);

            // Visual effect
            const stringEl = document.querySelector(`.guitar-string[data-string="${stringIndex}"]`);
            if (stringEl) {
                stringEl.classList.add('vibrating');
                setTimeout(() => stringEl.classList.remove('vibrating'), 150);
            }
        }

        // --- Drum Synth ---
        function playDrum(type, velocity = 80) {
            if (!audioContext) return;
            const time = audioContext.currentTime;
            // Boosted Volume
            const volume = Math.min(Math.max(velocity / 20, 0.5), 2.5);

            if (type === 'kick') {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);

                // Increased frequencies so laptop speakers can actually play them
                osc.frequency.setValueAtTime(300, time);
                osc.frequency.exponentialRampToValueAtTime(50, time + 0.5);
                gain.gain.setValueAtTime(1 * volume, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);

                osc.start(time);
                osc.stop(time + 0.5);
            }
            else if (type === 'snare') {
                const osc = audioContext.createOscillator();
                const oscGain = audioContext.createGain();
                osc.type = 'triangle';
                osc.connect(oscGain);
                oscGain.connect(audioContext.destination);

                osc.frequency.setValueAtTime(100, time);
                oscGain.gain.setValueAtTime(0.7 * volume, time);
                oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
                osc.start(time);
                osc.stop(time + 0.2);

                const bufferSize = audioContext.sampleRate * 0.2;
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioContext.createBufferSource();
                noise.buffer = buffer;

                const filter = audioContext.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 1000;

                const noiseGain = audioContext.createGain();
                noiseGain.gain.setValueAtTime(1 * volume, time);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioContext.destination);
                noise.start(time);
            }
            else if (type === 'hihat') {
                const bufferSize = audioContext.sampleRate * 0.1;
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioContext.createBufferSource();
                noise.buffer = buffer;

                const filter = audioContext.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 7000;

                const noiseGain = audioContext.createGain();
                noiseGain.gain.setValueAtTime(0.5 * volume, time);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioContext.destination);
                noise.start(time);
            }
            else if (type === 'tom1' || type === 'floorTom') {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);

                // Increased frequencies so laptop speakers can actually play them
                const freq = type === 'tom1' ? 400 : 250;
                osc.frequency.setValueAtTime(freq, time);
                osc.frequency.exponentialRampToValueAtTime(50, time + 0.4);

                gain.gain.setValueAtTime(0.8 * volume, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.4);

                osc.start(time);
                osc.stop(time + 0.4);
            }
            else if (type === 'crash') {
                const bufferSize = audioContext.sampleRate * 1.5;
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-3 * i / bufferSize);
                }
                const noise = audioContext.createBufferSource();
                noise.buffer = buffer;

                const filter = audioContext.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 4000;

                const noiseGain = audioContext.createGain();
                noiseGain.gain.setValueAtTime(0.8 * volume, time);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 1.5);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioContext.destination);
                noise.start(time);
            }
        }

        // --- Piano Audio ---
        function playNote(note, velocity = 80) {
            if (audioContext && audioBuffers[note]) {
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffers[note];

                // Boosted Volume
                const volume = Math.min(Math.max(velocity / 20, 0.5), 2.5);
                const gainNode = audioContext.createGain();
                gainNode.gain.value = volume;

                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                source.start(0);
                return { source, gainNode };
            }
            return null;
        }

        function stopNote(noteObj) {
            if (noteObj && noteObj.gainNode && audioContext) {
                const time = audioContext.currentTime;
                noteObj.gainNode.gain.setValueAtTime(noteObj.gainNode.gain.value, time);
                noteObj.gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                setTimeout(() => {
                    try { noteObj.source.stop(); } catch (e) { }
                }, 100);
            }
        }

        // --- Detection & Collision ---
        async function initDetector() {
            const model = handPoseDetection.SupportedModels.MediaPipeHands;
            const detectorConfig = {
                runtime: 'mediapipe',
                solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands',
                maxHands: 2
            };
            detector = await handPoseDetection.createDetector(model, detectorConfig);
        }

        function getVideoLayout() {
            const videoRatio = video.videoWidth / video.videoHeight;
            const canvasRatio = window.innerWidth / window.innerHeight;

            let renderWidth, renderHeight, offsetX, offsetY;
            if (canvasRatio > videoRatio) {
                renderWidth = window.innerWidth;
                renderHeight = window.innerWidth / videoRatio;
                offsetX = 0;
                offsetY = (window.innerHeight - renderHeight) / 2;
            } else {
                renderHeight = window.innerHeight;
                renderWidth = window.innerHeight * videoRatio;
                offsetX = (window.innerWidth - renderWidth) / 2;
                offsetY = 0;
            }
            return { renderWidth, renderHeight, offsetX, offsetY };
        }

        function getDatasetFromPos(x, y, selector, dataKey) {
            const container = document.querySelector(selector);
            if (!container) return null;
            const containerRect = container.getBoundingClientRect();

            if (y >= containerRect.top && y <= containerRect.bottom && x >= containerRect.left && x <= containerRect.right) {
                // document.elementsFromPoint works perfectly even with CSS rotation!
                const elements = document.elementsFromPoint(x, y);
                for (let el of elements) {
                    if (el.dataset[dataKey] !== undefined) return el.dataset[dataKey];
                }
            }
            return null;
        }

        let activeFingers = {};
        let previousTipPositions = {};
        let drumCooldown = {};
        let drumLocks = {}; // Tracks locked drums for Lift-and-Strike physics
        const fingerTipIndices = [4, 8, 12, 16, 20];

        // Funny Drumsticks
        const funnySticks = ['stick', '🧹', '🥒', '🏏', '🥖', '🐟', '🦴'];
        let currentStickIndex = 0;
        let gestureCycleLocked = false;

        function isPalmOpen(hand) {
            const wrist = hand.keypoints[0];
            let openFingers = 0;
            const pairs = [[8, 5], [12, 9], [16, 13], [20, 17]];
            pairs.forEach(pair => {
                const tip = hand.keypoints[pair[0]];
                const mcp = hand.keypoints[pair[1]];
                const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                const mcpDist = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y);
                if (tipDist > mcpDist * 1.3) openFingers++;
            });
            return openFingers >= 3;
        }

        async function detectHands() {
            if (detector && video.readyState >= 2) {
                const hands = await detector.estimateHands(video);
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                const currentFingers = {};
                const layout = getVideoLayout();

                if (currentMode === 'guitar') {
                    frettedStrings = [0, 0, 0, 0, 0, 0];
                }

                if (currentMode === 'drums' && hands.length >= 2) {
                    const hand1Open = isPalmOpen(hands[0]);
                    const hand2Open = isPalmOpen(hands[1]);
                    if (hand1Open && hand2Open) {
                        if (!gestureCycleLocked) {
                            currentStickIndex = (currentStickIndex + 1) % funnySticks.length;
                            gestureCycleLocked = true;
                        }
                    } else {
                        gestureCycleLocked = false;
                    }
                }

                if (hands.length > 0) {
                    hands.forEach((hand, handIndex) => {
                        const mapCoord = (kp) => {
                            const rX = (kp.x / video.videoWidth) * layout.renderWidth + layout.offsetX;
                            return {
                                x: window.innerWidth - rX,
                                y: (kp.y / video.videoHeight) * layout.renderHeight + layout.offsetY,
                                z: kp.z
                            };
                        };

                        if (currentMode === 'piano') {
                            fingerTipIndices.forEach((tipIndex) => {
                                const tipRaw = hand.keypoints[tipIndex];
                                const tip = mapCoord(tipRaw);

                                const isStriking = true; // Always strike on hover

                                overlayCtx.beginPath();
                                overlayCtx.arc(tip.x, tip.y, 6, 0, 2 * Math.PI);
                                overlayCtx.fillStyle = "#007bff";
                                overlayCtx.fill();

                                const hoveredTarget = getDatasetFromPos(tip.x, tip.y, '.piano-scroll-wrapper', 'note');
                                const fingerId = `${handIndex}-${tipIndex}`;

                                let velocity = 0;
                                if (previousTipPositions[fingerId]) {
                                    const dx = tip.x - previousTipPositions[fingerId].x;
                                    const dy = tip.y - previousTipPositions[fingerId].y;
                                    velocity = Math.sqrt(dx * dx + dy * dy);
                                }
                                previousTipPositions[fingerId] = { x: tip.x, y: tip.y, z: tip.z };

                                if (hoveredTarget && isStriking) {
                                    currentFingers[fingerId] = hoveredTarget;
                                    if (activeFingers[fingerId]?.note !== hoveredTarget) {
                                        const noteObj = playNote(hoveredTarget, velocity);
                                        activeFingers[fingerId] = { note: hoveredTarget, noteObj: noteObj };

                                        overlayCtx.beginPath();
                                        overlayCtx.arc(tip.x, tip.y, 12, 0, 2 * Math.PI);
                                        overlayCtx.fillStyle = "#ff4757";
                                        overlayCtx.fill();
                                    } else {
                                        activeFingers[fingerId].note = hoveredTarget;
                                    }
                                }
                            });
                        } else if (currentMode === 'drums') {
                            const wrist = mapCoord(hand.keypoints[0]);
                            const index = mapCoord(hand.keypoints[8]);

                            const dx = index.x - wrist.x;
                            const dy = index.y - wrist.y;

                            const tipX = wrist.x + dx * 1.5;
                            const tipY = wrist.y + dy * 1.5;

                            const activeStick = funnySticks[currentStickIndex];

                            if (activeStick === 'stick') {
                                // Draw the wooden drumstick
                                overlayCtx.beginPath();
                                overlayCtx.moveTo(wrist.x, wrist.y);
                                overlayCtx.lineTo(tipX, tipY);
                                overlayCtx.lineWidth = 14;
                                overlayCtx.lineCap = 'round';
                                overlayCtx.strokeStyle = '#d4a373';
                                overlayCtx.stroke();

                                // Draw the tip of the drumstick
                                overlayCtx.beginPath();
                                overlayCtx.arc(tipX, tipY, 12, 0, 2 * Math.PI);
                                overlayCtx.fillStyle = '#faedcd';
                                overlayCtx.fill();
                            } else {
                                // Dynamically scale emoji to match the physical collision stick
                                const stickLength = Math.hypot(dx, dy) * 1.5;
                                const angle = Math.atan2(dy, dx);

                                overlayCtx.save();
                                overlayCtx.translate(wrist.x, wrist.y);
                                overlayCtx.rotate(angle);

                                // Make the emoji font size scale with the stick length
                                overlayCtx.font = `${Math.max(stickLength * 0.8, 40)}px Arial`;
                                overlayCtx.textAlign = 'center';
                                overlayCtx.textBaseline = 'middle';

                                // Draw the emoji so its center is halfway down the stick, 
                                // meaning the edge of the emoji perfectly hits the collision tip
                                overlayCtx.fillText(activeStick, stickLength / 2, 0);
                                overlayCtx.restore();
                            }

                            const stickId = `stick-${handIndex}`;

                            let velocity = 0;
                            let yVelocity = 0;
                            if (previousTipPositions[stickId]) {
                                const dxx = tipX - previousTipPositions[stickId].x;
                                const dyy = tipY - previousTipPositions[stickId].y; // Positive = moving down
                                yVelocity = dyy;
                                velocity = Math.sqrt(dxx * dxx + dyy * dyy);
                            }
                            previousTipPositions[stickId] = { x: tipX, y: tipY };

                            // Mathematical Collision Detection (Ignores DOM bugs)
                            const drumPads = document.querySelectorAll('.drum-pad');
                            let hoveredTarget = null;
                            let minDistance = Infinity;

                            drumPads.forEach(pad => {
                                const rect = pad.getBoundingClientRect();
                                const cx = rect.left + rect.width / 2;
                                const cy = rect.top + rect.height / 2;
                                const radius = Math.min(rect.width, rect.height) / 2;

                                const dx = tipX - cx;
                                const dy = tipY - cy;
                                const distance = Math.sqrt(dx * dx + dy * dy);

                                if (distance <= radius && distance < minDistance) {
                                    minDistance = distance;
                                    hoveredTarget = pad.dataset.drum;
                                }
                            });

                            // Lift-and-Strike Physics
                            // If they lift their hand even slightly (negative Y velocity), unlock the drum instantly
                            if (yVelocity < -0.2) {
                                drumLocks[stickId] = null;
                            }

                            if (hoveredTarget) {
                                // Strike! Only if not locked to this specific drum
                                if (drumLocks[stickId] !== hoveredTarget) {
                                    playDrum(hoveredTarget, Math.max(velocity * 3, 60)); // Punchy volume

                                    // Lock it so it doesn't double-hit until they lift or leave
                                    drumLocks[stickId] = hoveredTarget;

                                    // Visual impact flash
                                    overlayCtx.beginPath();
                                    overlayCtx.arc(tipX, tipY, 30, 0, 2 * Math.PI);
                                    overlayCtx.fillStyle = "rgba(255, 255, 255, 0.9)";
                                    overlayCtx.fill();
                                }
                            } else {
                                // If they leave all drum pads, unlock automatically
                                drumLocks[stickId] = null;
                            }
                        } else if (currentMode === 'guitar') {
                            const wrist = mapCoord(hand.keypoints[0]);

                             // Left Hand: Fretting (Neck is left 55% of screen)
                            if (wrist.x < window.innerWidth * 0.55) {
                                fingerTipIndices.forEach((tipIndex) => {
                                    const tip = mapCoord(hand.keypoints[tipIndex]);
                                    
                                    const hoveredString = getDatasetFromPos(tip.x, tip.y, '#strings-container', 'string');
                                    const hoveredFret = getDatasetFromPos(tip.x, tip.y, '#real-fretboard', 'fret');
                                    
                                    if (hoveredString !== null && hoveredFret !== null) {
                                        const sIdx = parseInt(hoveredString);
                                        const fIdx = parseInt(hoveredFret);
                                        if (fIdx > frettedStrings[sIdx]) {
                                            frettedStrings[sIdx] = fIdx;
                                        }
                                    }
                                    
                                    overlayCtx.beginPath();
                                    overlayCtx.arc(tip.x, tip.y, 8, 0, 2 * Math.PI);
                                    overlayCtx.fillStyle = "#007bff"; 
                                    overlayCtx.fill();
                                });
                                
                            } else {
                                // Right Hand: Strumming (Bottom 45% of screen)
                                const indexTipScreen = mapCoord(hand.keypoints[8]);

                                // Draw Pick
                                overlayCtx.beginPath();
                                overlayCtx.moveTo(indexTipScreen.x, indexTipScreen.y - 10);
                                overlayCtx.lineTo(indexTipScreen.x - 10, indexTipScreen.y + 15);
                                overlayCtx.lineTo(indexTipScreen.x + 10, indexTipScreen.y + 15);
                                overlayCtx.closePath();
                                overlayCtx.fillStyle = '#ff4757';
                                overlayCtx.fill();

                                const pickId = `pick-${handIndex}`;
                                let prevPos = previousTipPositions[pickId] || indexTipScreen;
                                let velocity = 80;

                                if (previousTipPositions[pickId]) {
                                    const dy = indexTipScreen.y - prevPos.y;
                                    const dx = indexTipScreen.x - prevPos.x;
                                    velocity = Math.max(Math.hypot(dx, dy) * 2, 40);
                                }
                                previousTipPositions[pickId] = { x: indexTipScreen.x, y: indexTipScreen.y };

                                if (!guitarMathInitialized) initGuitarMath();

                                const currUnrotated = toUnrotated(indexTipScreen.x, indexTipScreen.y);
                                const prevUnrotated = toUnrotated(prevPos.x, prevPos.y);

                                // Check String Crossing (Rotated Y-axis)
                                stringLocalLines.forEach((line) => {
                                    if ((prevUnrotated.y < line.y && currUnrotated.y >= line.y) || 
                                        (prevUnrotated.y > line.y && currUnrotated.y <= line.y)) {
                                        playGuitarString(line.index, Math.max(velocity * 3, 50));
                                    }
                                });
                            }
                        }
                    });
                }

                // Cleanup and Dampen off-fingers
                for (let id in activeFingers) {
                    if (!currentFingers[id]) {
                        if (currentMode === 'piano' && activeFingers[id].noteObj) {
                            stopNote(activeFingers[id].noteObj);
                        }
                        delete activeFingers[id];
                    }
                }

                // Visual updates
                if (currentMode === 'piano') {
                    const currentlyPressed = new Set(Object.values(activeFingers).map(f => f.note));
                    document.querySelectorAll('.key').forEach(k => {
                        if (currentlyPressed.has(k.dataset.note)) k.classList.add('active');
                        else k.classList.remove('active');
                    });
                } else if (currentMode === 'drums') {
                    const currentlyPressed = new Set(Object.values(activeFingers));
                    document.querySelectorAll('.drum-pad').forEach(d => {
                        if (currentlyPressed.has(d.dataset.drum)) d.classList.add('active');
                        else d.classList.remove('active');
                    });
                }
            }
            requestAnimationFrame(detectHands);
        }

        startBtn.addEventListener('click', async () => {
            try {
                startBtn.style.display = "none";
                loadingText.style.display = "block";

                // MUST RESUME SYNCHRONOUSLY BEFORE ANY AWAIT!
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                await initAudio();

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 }
                });
                video.srcObject = stream;

                await initDetector();
                loadingText.style.display = "none";

                // Show UI
                modeToggle.style.display = 'flex';
                switchMode('piano');

                setTimeout(() => {
                    pianoScrollWrapper.scrollLeft = (24 * whiteKeyWidth) - (pianoScrollWrapper.clientWidth / 2);
                }, 100);

                video.onloadedmetadata = () => {
                    overlayCanvas.width = window.innerWidth;
                    overlayCanvas.height = window.innerHeight;
                    window.addEventListener('resize', () => {
                        overlayCanvas.width = window.innerWidth;
                        overlayCanvas.height = window.innerHeight;
                        guitarMathInitialized = false;
                    });
                    detectHands();
                };
            } catch (error) {
                console.error("Error:", error);
                loadingText.innerText = "Error starting camera or loading model.";
            }
        });
    </script>
</body>

</html>
